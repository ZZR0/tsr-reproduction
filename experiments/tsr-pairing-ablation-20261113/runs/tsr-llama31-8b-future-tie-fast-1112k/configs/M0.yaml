model_name_or_path: /mnt/sn-007/zaninzeng/tsr-reproduction/work/base/Llama-3.1-8B
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2
chat_template: '{% for message in messages %}

  {% if message[''role''] == ''user'' %}

  {{ ''<|user|>

  '' + message[''content''] + eos_token }}

  {% elif message[''role''] == ''system'' %}

  {{ ''<|system|>

  '' + message[''content''] + eos_token }}

  {% elif message[''role''] == ''assistant'' %}

  {{ ''<|assistant|>

  ''  + message[''content''] + eos_token }}

  {% endif %}

  {% if loop.last and add_generation_prompt %}

  {{ ''<|assistant|>'' }}

  {% endif %}

  {% endfor %}'
dataset_mixer:
  /mnt/sn-007/zaninzeng/tsr-reproduction/work/runs/tsr-llama31-8b-future-only-1111c/bundle/third_party/TSR/data/sft_data: 1.0
dataset_splits:
- train
- test
preprocessing_num_workers: 12
bf16: true
do_eval: true
eval_strategy: epoch
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_model_id: M0
hub_strategy: every_save
learning_rate: 2.0e-06
log_level: info
logging_steps: 5
logging_strategy: steps
lr_scheduler_type: cosine
max_seq_length: 2048
max_steps: -1
num_train_epochs: 3
output_dir: /mnt/sn-007/zaninzeng/tsr-reproduction/work/runs/tsr-llama31-8b-future-only-1111c/trial/models/M0
overwrite_output_dir: true
per_device_eval_batch_size: 2
per_device_train_batch_size: 2
push_to_hub: false
remove_unused_columns: true
report_to:
- tensorboard
save_strategy: 'no'
save_total_limit: 1
save_only_model: true
save_safetensors: false
seed: 42
warmup_ratio: 0.1
