
model_name_or_path: ../models/Llama-3.1-8B-mix-sft-epoch3-self_rewarding-iter1
torch_dtype: null

# Data training arguments
# For definitions, see: src/h4/training/config.py
dataset_mixer:
  ../settings/sr/data_dpo/iter2: 1.0
dataset_splits:
- train
# - test
# prefs
preprocessing_num_workers: 12

# DPOTrainer arguments
bf16: true
beta: 0.1
do_eval: false
gradient_accumulation_steps: 2
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
hub_model_id: Llama-3.1-8B-mix-sft-epoch3-self_rewarding-iter2
learning_rate: 5.0e-7
log_level: info
logging_steps: 10
lr_scheduler_type: cosine
max_length: 2048
max_prompt_length: 512
num_train_epochs: 1
optim: adamw_torch
output_dir: ../models/Llama-3.1-8B-mix-sft-epoch3-self_rewarding-iter2
per_device_train_batch_size: 2
push_to_hub: false
save_strategy: "no"
save_steps: 100
save_total_limit: 1
save_only_model: true
save_safetensors: false
seed: 42
warmup_ratio: 0.1
